# MirrorMarket AI - local development stack.
#
#   make up        # build + start everything, wait until healthy
#   make down      # stop (data kept in named volumes)
#   make reset-db  # stop AND delete local data volumes
#
# All ports bind to 127.0.0.1 only, so nothing is exposed to your Wi-Fi network.
# Host ports default to non-standard values (5433, 6380) to avoid clashing with
# other Postgres/Redis instances you may already run; override them in .env.

name: mirrormarket

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Shared settings for every container built from the backend image.
x-app-service: &app-service
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  build:
    context: ./backend
  image: mirrormarket-api:dev
  env_file:
    - path: .env
      required: false
  environment:
    # Inside the Compose network, services reach each other by service name
    # on their container ports, not via the host ports.
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mirrormarket}:${POSTGRES_PASSWORD:-mirrormarket}@postgres:5432/${POSTGRES_DB:-mirrormarket}
    REDIS_URL: redis://redis:6379/0
    KAFKA_ENABLED: "true"
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    LOG_FORMAT: json
    # Tracing is off unless started with OTEL_ENABLED=true (`make obs-up` does that);
    # Jaeger only runs in the "observability" profile.
    OTEL_ENABLED: ${OTEL_ENABLED:-false}
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Workers serve their own /metrics here (inside the Compose network only).
    WORKER_METRICS_PORT: "9100"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL

services:
  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mirrormarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mirrormarket}
      POSTGRES_DB: ${POSTGRES_DB:-mirrormarket}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper). Data is not persisted: events
  # are derived from PostgreSQL (the outbox), so a fresh broker loses nothing durable.
  # INTERNAL is for containers (kafka:9092); EXTERNAL is for tools on the host.
  kafka:
    <<: *hardening
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  # One-shot job: apply Alembic migrations, then exit. The api waits for it to
  # succeed, so the API never starts against an out-of-date schema.
  migrate:
    <<: *app-service
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    ports: []
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app-service
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Background worker: chunks + embeds newly ingested documents.
  # Scale with: docker compose up -d --scale embedding-worker=3
  embedding-worker:
    <<: *app-service
    command: ["python", "-m", "app.workers.embedding_worker"]
    ports: []
    # Healthy while the worker keeps touching its heartbeat file (every poll/job).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/embedding-worker.heartbeat') < 60 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Publishes the outbox to Kafka and runs the Kafka consumers (activity feed).
  event-worker:
    <<: *app-service
    command: ["python", "-m", "app.workers.event_worker"]
    ports: []
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/event-worker.heartbeat') < 60 else 1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Observability (optional): docker compose --profile observability up -d
  #   Grafana     http://127.0.0.1:3001   dashboards (anonymous viewer, local only)
  #   Prometheus  http://127.0.0.1:9090   metrics and alert rules
  #   Jaeger      http://127.0.0.1:16686  traces
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *hardening
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  grafana:
    <<: *hardening
    profiles: ["observability"]
    image: grafana/grafana:13.2.2
    environment:
      # Local convenience only: the port is bound to 127.0.0.1. Anyone who can reach
      # it may look, nobody may change anything without the admin password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mirrormarket.json
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || curl -fsS -o /dev/null http://127.0.0.1:3000/api/health
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      prometheus:
        condition: service_healthy

  jaeger:
    <<: *hardening
    profiles: ["observability"]
    image: jaegertracing/jaeger:2.20.0
    environment:
      # Accept OTLP from the other containers, not only from inside this one.
      JAEGER_LISTEN_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${JAEGER_HOST_PORT:-16686}:16686"

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
