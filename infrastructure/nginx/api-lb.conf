# Load balancer in front of several API containers (docker-compose.scale.yml).
# Each request goes to the API container with the fewest requests in flight, so a
# client that keeps one connection open is still spread over every container.

# Docker's DNS server: re-resolve `api` so replicas started later are added.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    least_conn;
    server api:8000 resolve;
    keepalive 64;
}

# WebSocket upgrades pass through; ordinary requests reuse upstream connections.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 8000;
    server_tokens off;
    # Every request is already measured by k6 and the API's own metrics.
    access_log off;

    # The API enforces its own body limit (MAX_REQUEST_BODY_BYTES, at most 64 MB), so the
    # balancer allows the largest value that setting can take.
    client_max_body_size 64m;

    location = /nginx-health {
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # A full analysis can take a while under load; WebSockets stay open longer.
        proxy_read_timeout 120s;
    }
}
