# Prometheus for the local stack (docker compose --profile observability).
# Targets are Compose service names; nothing here is reachable from outside the
# Compose network except through the ports published on 127.0.0.1.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Workers have no HTTP API; they serve /metrics on WORKER_METRICS_PORT.
  - job_name: event-worker
    static_configs:
      - targets: ["event-worker:9100"]

  - job_name: embedding-worker
    static_configs:
      - targets: ["embedding-worker:9100"]
