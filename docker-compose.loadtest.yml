# Load-test overlay (Phase 29). Used on top of docker-compose.yml:
#
#   make load-up        the stack, configured so a load test measures the application
#   make load-smoke     30-second check that every scripted request works
#   make load-test      steady load, per-request latency
#   make load-capacity  stepped load: where it stops keeping up
#
# What it changes, and why:
# - Offline engines, whatever .env says: a load test must never call a paid model API,
#   and model latency is not what is being measured.
# - Rate limits raised to their maximum: a handful of synthetic users send far more than
#   one person would. The limiter still runs on every request, so its cost is included.
# - API_WORKERS: number of API processes in the container (default 1, the normal setup).

x-loadtest-env: &loadtest-env
  AGENT_ENGINE: rules
  REQUIREMENTS_EXTRACTOR: rules
  EMBEDDING_PROVIDER: hashing
  RATE_LIMIT_AUTH_PER_MINUTE: "10000"
  RATE_LIMIT_AGENTS_PER_MINUTE: "10000"
  LOG_LEVEL: WARNING

services:
  api:
    environment:
      <<: *loadtest-env
      # uvicorn reads WEB_CONCURRENCY as its number of worker processes.
      WEB_CONCURRENCY: ${API_WORKERS:-1}

  embedding-worker:
    environment: *loadtest-env

  event-worker:
    environment: *loadtest-env

  # The load generator. Runs inside the Compose network and calls the API by service
  # name, so no host networking is involved and it behaves the same on macOS and Linux.
  k6:
    profiles: ["loadtest"]
    image: grafana/k6:1.3.0
    security_opt:
      - no-new-privileges:true
    environment:
      BASE_URL: http://api:8000
      RESULTS_DIR: /results
    volumes:
      - ./benchmarks/k6:/scripts:ro
      - ./benchmarks/results/raw:/results
    entrypoint: ["k6", "run", "--no-usage-report", "--quiet", "/scripts/workload.js"]
    depends_on:
      api:
        condition: service_healthy
