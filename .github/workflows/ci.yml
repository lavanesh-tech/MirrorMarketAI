name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python (from backend/.python-version)
        run: uv python install

      - name: Install dependencies (must match uv.lock exactly)
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      # Includes database/migration tests: Testcontainers starts a pgvector
      # container using the runner's Docker daemon.
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (must match package-lock.json exactly)
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Prettier
        run: npm run format:check

      # The typed API client must match docs/api/openapi.json.
      - name: API types are up to date
        run: npm run api:check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  docker:
    name: Docker (build image, start stack, smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    steps:
      - uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test health and readiness endpoints
        run: |
          curl -fsS -i http://127.0.0.1:8000/api/v1/health
          curl -fsS http://127.0.0.1:8000/api/v1/health | grep -q '"status":"ok"'
          curl -fsS -i http://127.0.0.1:8000/api/v1/ready
          curl -fsS http://127.0.0.1:8000/api/v1/ready | grep -q '"status":"ready"'
          curl -fsS http://127.0.0.1:8000/api/v1/ready | grep -q '"redis":{"status":"ok"'

      # A comment written through the API must reach the activity feed:
      # outbox -> relay -> Kafka -> consumer -> read model.
      - name: Smoke test the event pipeline (outbox -> Kafka -> activity feed)
        run: python3 infrastructure/scripts/smoke_events.py

      - name: Verify migrations ran
        run: docker compose logs migrate | grep -q "Running upgrade"

      - name: Verify pgvector extension
        run: |
          docker compose exec -T postgres \
            psql -U mirrormarket -d mirrormarket -tAc \
            "SELECT extversion FROM pg_extension WHERE extname = 'vector';" | grep -E '^[0-9]+\.[0-9]+'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end (Playwright against the Docker stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the API stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (must match package-lock.json exactly)
        working-directory: frontend
        run: npm ci

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build the web app
        working-directory: frontend
        run: npm run build

      # A real browser goes through the whole product: account, requirements, products
      # with evidence, comparison, grounded answers and live collaboration.
      - name: Playwright
        working-directory: frontend
        run: npm run e2e

      - name: Keep traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs --no-color api

      - name: Tear down
        if: always()
        run: docker compose down -v
