# Alembic configuration for MirrorMarket AI.
#
# The database URL is NOT stored here. migrations/env.py reads it from the
# application Settings (DATABASE_URL env var / .env) so credentials live in one
# place and never in a committed file.
#
# Common commands (run from backend/, or use the Makefile targets):
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "add users table"
#   uv run alembic downgrade -1
#   uv run alembic current

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision files: 20260930_1200_<rev>_<slug>.py, sorted chronologically in the folder.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
path_separator = os

[post_write_hooks]
# Format generated migrations with the project's ruff settings.
hooks = ruff_format, ruff_fix
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
