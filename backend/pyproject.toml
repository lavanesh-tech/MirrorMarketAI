[project]
name = "mirrormarket-backend"
version = "0.1.0"
description = "MirrorMarket AI backend: collaborative, evidence-backed purchasing intelligence API."
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "lavanesh-tech" }]
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=2.3",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.uv]
# This is an application, not a library: uv installs dependencies only and the
# `app` package is imported from the source tree (tests via pytest `pythonpath`).
package = false
# Commit uv.lock so every machine (Mac, CI, Docker) resolves identical versions.
default-groups = ["dev"]

# --------------------------------------------------------------------------- #
# Ruff: linter + formatter (replaces flake8, isort, black, pyupgrade).
# --------------------------------------------------------------------------- #
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "S",        # flake8-bandit (security smells)
    "ASYNC",    # async pitfalls (blocking calls in async code)
    "C4",       # comprehensions
    "SIM",      # simplifications
    "RUF",      # ruff-specific
    "PT",       # pytest style
    "N",        # naming
    "DTZ",      # naive datetimes
    "T20",      # stray print()
    "PL",       # pylint subset
]
ignore = [
    "PLR0913",  # too many arguments: FastAPI dependency signatures legitimately have many
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is the point of tests
    "PLR2004",  # magic values in assertions are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in defaults are intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# mypy: strict everywhere, including tests.
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["app", "tests", "migrations"]

[[tool.mypy.overrides]]
# asyncpg ships no type information; it is only used directly in test setup.
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # Third-party noise from the Testcontainers/Docker SDK, not from our code.
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore:unclosed <socket.socket:ResourceWarning",
]
markers = [
    "unit: fast tests with no I/O",
    "api: HTTP-level tests against the ASGI app (in-process, no network)",
    "db: needs PostgreSQL (Testcontainers, or TEST_DATABASE_URL if set)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
